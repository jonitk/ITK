name: Build check

# Netlify hosts the site. This workflow only confirms every push builds,
# and keeps a copy of the built site for comparing changes.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://www.inthekitchen.is
          BASE_PATH: /

      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
