name: Build check

# Netlify hosts the site. This workflow only confirms every push builds,
# and saves the built site to a `builds/<branch>` branch so changes can be
# compared page by page.

on:
  push:
    branches-ignore: ['builds/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Save the built site to a branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cd dist
          git init -q -b main
          git config user.name "build-check"
          git config user.email "build-check@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${BRANCH} at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/builds/${BRANCH}"
